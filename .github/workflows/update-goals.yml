name: Update BDOG Goals

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-goals:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update goal titles and images
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
            "goal(this,'More Power')": "goal(this,'Power')",
            "<h3>More Power</h3>": "<h3>Power</h3>",
            "goal(this,'Better Handling')": "goal(this,'Handling')",
            "<h3>Better Handling</h3>": "<h3>Handling</h3>",
            "goal(this,'Better Sound')": "goal(this,'Sound')",
            "<h3>Better Sound</h3>": "<h3>Sound</h3>",
            "goal(this,'Better Looks')": "goal(this,'Looks')",
            "<h3>Better Looks</h3>": "<h3>Looks</h3>",
            ".goal-power{background-image:url('https://images.unsplash.com/photo-1619767886558-efdc259cde1a?auto=format&fit=crop&w=800&q=85')}": ".goal-power{background-image:url('https://images.unsplash.com/photo-1486262715619-67b85e0b08d3?auto=format&fit=crop&w=800&q=85')}",
            ".goal-handling{background-image:url('https://images.unsplash.com/photo-1504215680853-026ed2a45def?auto=format&fit=crop&w=800&q=85')}": ".goal-handling{background-image:url('https://blog-int.kwautomotive.net/wp-content/uploads/2014/04/IMG_8434.jpg')}",
            ".goal-sound{background-image:url('https://images.unsplash.com/photo-1600706432502-77a0e2e327b0?auto=format&fit=crop&w=800&q=85')}": ".goal-sound{background-image:url('https://www.nps.gov/articles/images/dual-exhaust.jpg')}",
            ".goal-looks{background-image:url('https://images.unsplash.com/photo-1553440569-bcc63803a83d?auto=format&fit=crop&w=800&q=85')}": ".goal-looks{background-image:url('https://images.unsplash.com/photo-1553440569-bcc63803a83d?auto=format&fit=crop&w=800&q=85')}",
            ".goal-road{background-image:url('https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=800&q=85')}": ".goal-road{background-image:url('https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=800&q=85')}",
            ".goal-track{background-image:url('https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=800&q=85')}": ".goal-track{background-image:url('https://www.smgmotorsport.com/cdn/shop/articles/rs_w_1280_7.webp?v=1721041749&width=1100')}",
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "BDOG Automotive"
          git config user.email "liambrewin@bdogautomotive.co.uk"
          git add index.html
          git commit -m "Refine build goals with relevant imagery" || exit 0
          git push
