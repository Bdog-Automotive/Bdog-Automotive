name: Update BDOG homepage hero image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hero-image-update.yml'

permissions:
  contents: write

jobs:
  update-hero:
    if: "!contains(github.event.head_commit.message, '[hero-update]')"
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Replace hero image and remove image text overlay
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "background:linear-gradient(90deg,rgba(5,6,8,.2),rgba(5,6,8,.02)),url('https://images.unsplash.com/photo-1492144534655-ae79c964c9d7?auto=format&fit=crop&w=1600&q=88');background-size:cover;background-position:center"
          new = "background:url('https://images.unsplash.com/photo-1683075085004-ebd9bea139c7?auto=format&fit=crop&fm=jpg&ixlib=rb-4.1.0&q=88&w=1600');background-size:cover;background-position:center"
          if old not in s:
              raise SystemExit('Current hero image CSS was not found; stopping without changing the site.')
          s = s.replace(old, new, 1)
          old_label_css = ".hero-media:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.8))}.hero-label{position:absolute;left:20px;bottom:20px;z-index:2;background:rgba(5,7,10,.9);border:1px solid #414b57;border-radius:10px;padding:13px 15px}.hero-label b{font-size:17px}.hero-label small{display:block;color:#9ba3ad;margin-top:4px}.section"
          new_label_css = ".section"
          if old_label_css not in s:
              raise SystemExit('Hero text-overlay CSS was not found; stopping without changing the site.')
          s = s.replace(old_label_css, new_label_css, 1)
          old_label_html = '<div class="hero-media"><div class="hero-label"><b>BDOG AUTOMOTIVE</b><small>Real cars. Real parts. Built different.</small></div></div>'
          new_label_html = '<div class="hero-media"></div>'
          if old_label_html not in s:
              raise SystemExit('Hero text-overlay HTML was not found; stopping without changing the site.')
          s = s.replace(old_label_html, new_label_html, 1)
          p.write_text(s)
          PY

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/hero-image-update.yml
          git commit -m "Update homepage hero image [hero-update]"
          git push
